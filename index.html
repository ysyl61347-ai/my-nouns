<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nouns - تعلم الإنجليزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; margin: 0; }
        /* محاكاة حجم شاشة الهاتف */
        .phone-frame { width: 100%; max-width: 400px; background-color: #ffffff; height: 100vh; max-height: 850px; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        /* إخفاء شريط التمرير */
        .phone-frame::-webkit-scrollbar { display: none; }
        .phone-frame { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<div class="phone-frame pb-20">
    <!-- الشريط العلوي (Header) -->
    <header class="bg-blue-600 text-white p-4 flex justify-between items-center rounded-b-2xl shadow-md">
        <i class="fas fa-bars text-xl cursor-pointer"></i>
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fas fa-graduation-cap"></i> My Nouns
        </h1>
        <div class="w-6"></div> <!-- مساحة فارغة للتوازن -->
    </header>

    <div class="p-4">
        <!-- شريط البحث -->
        <div class="relative mb-4">
            <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
            <input type="text" placeholder="ابحث عن كلمة بالإنجليزية أو العربية..." class="w-full bg-gray-100 border-none rounded-xl py-3 pr-10 pl-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- التبويبات (Tabs) -->
        <div class="flex gap-2 mb-4">
            <button class="flex-1 bg-blue-600 text-white py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2">
                <i class="fas fa-heart"></i> الكل
            </button>
            <button class="flex-1 bg-gray-100 text-gray-600 py-2 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-gray-200 transition">
                <i class="far fa-heart"></i> المفضلة
            </button>
        </div>

        <!-- قائمة الكلمات -->
        <div class="space-y-3">
            
            <!-- كلمة 1 -->
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-red-50 rounded-lg flex items-center justify-center text-2xl">🏠</div>
                    <div>
                        <h3 class="font-bold text-gray-800">House</h3>
                        <p class="text-xs text-gray-500">منزل</p>
                        <p class="text-xs text-blue-500 font-mono">/haʊs/</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 text-gray-400">
                    <button class="hover:text-blue-500"><i class="fas fa-volume-up"></i></button>
                    <button class="hover:text-red-500"><i class="far fa-heart text-lg"></i></button>
                </div>
            </div>

            <!-- كلمة 2 -->
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-red-50 rounded-lg flex items-center justify-center text-2xl">🚗</div>
                    <div>
                        <h3 class="font-bold text-gray-800">Car</h3>
                        <p class="text-xs text-gray-500">سيارة</p>
                        <p class="text-xs text-blue-500 font-mono">/kɑːr/</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 text-gray-400">
                    <button class="hover:text-blue-500"><i class="fas fa-volume-up"></i></button>
                    <button class="hover:text-red-500"><i class="far fa-heart text-lg"></i></button>
                </div>
            </div>

            <!-- كلمة 3 -->
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center text-2xl">📖</div>
                    <div>
                        <h3 class="font-bold text-gray-800">Book</h3>
                        <p class="text-xs text-gray-500">كتاب</p>
                        <p class="text-xs text-blue-500 font-mono">/bʊk/</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 text-gray-400">
                    <button class="hover:text-blue-500"><i class="fas fa-volume-up"></i></button>
                    <button class="hover:text-red-500"><i class="far fa-heart text-lg"></i></button>
                </div>
            </div>

            <!-- كلمة 4 -->
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-2xl">📱</div>
                    <div>
                        <h3 class="font-bold text-gray-800">Phone</h3>
                        <p class="text-xs text-gray-500">هاتف</p>
                        <p class="text-xs text-blue-500 font-mono">/foʊn/</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 text-gray-400">
                    <button class="hover:text-blue-500"><i class="fas fa-volume-up"></i></button>
                    <button class="hover:text-red-500"><i class="far fa-heart text-lg"></i></button>
                </div>
            </div>

        </div>
    </div>

    <!-- شريط التنقل السفلي (Bottom Navigation) -->
    <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around py-3 text-xs text-gray-400">
        <a href="#" class="flex flex-col items-center text-blue-600"><i class="fas fa-home text-lg mb-1"></i> الرئيسية</a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600"><i class="fas fa-search text-lg mb-1"></i> بحث</a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600"><i class="far fa-heart text-lg mb-1"></i> المفضلة</a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600"><i class="fas fa-cog text-lg mb-1"></i> الإعدادات</a>
    </nav>
</div>

</body>
                  </html>
