<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Nouns</title>
<style>
body{font-family:system-ui;background:#F5F6FA;margin:0;padding:16px;text-align:center}
.card{background:#fff;border-radius:20px;padding:30px;max-width:400px;margin:20px auto}
.em{font-size:100px}
.w{font-size:30px;font-weight:800;color:#2563EB;margin:10px 0;direction:ltr}
.a{font-size:20px;margin-bottom:20px}
button{padding:12px 18px;border:0;border-radius:10px;background:#2563EB;color:#fff;font-size:15px;margin:4px;font-weight:700}
</style>
</head>
<body>
<div class="card">
<div class="em" id="em">📖</div>
<div class="w" id="w">book</div>
<div class="a" id="a">كتاب</div>
<button onclick="say()">🔊 استمع</button>
<button onclick="nxt()">التالي</button>
</div>
<script>
var D=[["book","كتاب","📖"],["house","منزل","🏠"],["car","سيارة","🚗"],["dog","كلب","🐕"],["cat","قطة","🐈"]];
var i=0;
function r(){em.textContent=D[i][2];w.textContent=D[i][0];a.textContent=D[i][1]}
function nxt(){i=(i+1)%D.length;r()}
function say(){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(D[i][0]);u.lang="en-US";speechSynthesis.speak(u)}
r();
</script>
</body>
</html>
