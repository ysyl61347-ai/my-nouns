<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Nouns</title><style>body{font-family:system-ui;background:#F5F6FA;margin:0;padding:16px;text-align:center}.card{background:#fff;border-radius:20px;padding:30px;max-width:400px;margin:20px auto;box-shadow:0 4px 20px rgba(0,0,0,.08)}.em{font-size:120px}.w{font-size:32px;font-weight:800;color:#2563EB;margin:16px 0;direction:ltr}.a{font-size:22px;margin-bottom:20px}button{padding:14px 20px;border:0;border-radius:12px;background:#2563EB;color:#fff;font-size:16px;font-weight:700;margin:4px;cursor:pointer;font-family:inherit}.g{background:#E2E8F0;color:#0F172A}.s{background:#F59E0B}</style></head><body><div class="card"><div class="em" id="em">📖</div><div class="w" id="w">book</div><div class="a" id="a">كتاب</div><button onclick="say()">🔊 استمع</button><button class="s" onclick="fav()">⭐ حفظ</button><button class="g" onclick="prev()">السابق</button><button class="g" onclick="next()">التالي</button></div><div id="favs" style="color:#6B7280;margin-top:10px"></div><script>var D=[["book","كتاب","📖"],["house","منزل","🏠"],["car","سيارة","🚗"],["dog","كلب","🐕"],["cat","قطة","🐈"],["apple","تفاحة","🍎"],["water","ماء","💧"],["sun","شمس","☀️"],["moon","قمر","🌙"],["tree","شجرة","🌳"]];var i=0,F=[];function r(){document.getElementById('em').textContent=D[i][2];document.getElementById('w').textContent=D[i][0];document.getElementById('a').textContent=D[i][1];document.getElementById('favs').textContent=F.length?'⭐ محفوظة: '+F.length:''}function next(){i=(i+1)%D.length;r()}function prev(){i=(i-1+D.length)%D.length;r()}function say(){if(!speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(D[i][0]);u.lang='en-US';speechSynthesis.speak(u)}function fav(){if(F.indexOf(D[i][0])<0)F.push(D[i][0]);r()}r();</script></body></html>
