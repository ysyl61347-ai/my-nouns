<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Nouns</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#F5F6FA;color:#1F2937;min-height:100vh}.dark body{background:#0F172A;color:#F1F5F9}.dark{--bg:#1E293B;--tx2:#94A3B8;--bd:#334155}body{--bg:#FFF;--tx2:#6B7280;--bd:#E5E7EB}.top{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}.top h1{flex:1;font-size:17px;font-weight:800;text-align:center}.top button{background:rgba(255,255,255,.2);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}.wrap{padding:16px;padding-bottom:90px;max-width:600px;margin:0 auto}.card{background:var(--bg);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}.hero{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;text-align:center}.hero h2{font-size:20px;margin-bottom:4px}.hero p{font-size:13px;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--bg);border-radius:14px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}.stat b{display:block;font-size:22px;color:#4F46E5;font-weight:800}.stat span{font-size:11px;color:var(--tx2)}.progress{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:linear-gradient(90deg,#4F46E5,#7C3AED);transition:width .4s}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:0;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s}.btn:active{transform:scale(.96)}.btn-p{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;width:100%}.btn-g{background:var(--bd);color:inherit}.btn-s{background:#10B981;color:#fff}.btn-w{background:#F59E0B;color:#fff}.btn-o{background:var(--bg);border:2px solid var(--bd);color:inherit}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.big{padding:20px 12px;text-align:center;font-size:13px;font-weight:700}.big .ico{font-size:28px;display:block;margin-bottom:4px}.big .ttl{font-size:12px}.emoji{font-size:120px;text-align:center;padding:30px 0;background:linear-gradient(135deg,#E0E7FF,#C7D2FE);border-radius:20px 20px 0 0}.dark .emoji{background:linear-gradient(135deg,#312E81,#4C1D95)}.wen{font-size:32px;font-weight:800;color:#4F46E5;text-align:center;direction:ltr;margin:16px 0 4px}.war{font-size:22px;font-weight:700;text-align:center;margin-bottom:12px}.ex{background:rgba(0,0,0,.04);padding:12px;border-radius:10px;font-style:italic;font-size:13px;direction:ltr;margin:8px 0}.dark .ex{background:rgba(255,255,255,.05)}.chipline{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}.chip{padding:4px 10px;border-radius:20px;background:var(--bd);font-size:11px;font-weight:700}.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}.search{width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;font-size:15px;background:var(--bg);color:inherit;font-family:inherit;outline:none;margin-bottom:12px}.item{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05)}.item .em{font-size:30px}.item .inf{flex:1}.item .inf .e{font-size:15px;font-weight:700;direction:ltr;text-align:start}.item .inf .a{font-size:12px;color:var(--tx2)}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;z-index:20;max-width:600px;margin:0 auto;left:50%;transform:translateX(-50%)}.nav button{flex:1;background:0;border:0;padding:8px 0;color:var(--tx2);font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}.nav button.on{color:#4F46E5}.nav .ic{font-size:20px}.hide{display:none!important}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:#1F2937;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:.3s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{background:#10B981}.toast.bad{background:#EF4444}</style></head><body><div class="top"><button id="lg">EN</button><h1>📚 My Nouns</h1><button id="th">🌙</button></div><div id="wrap" class="wrap"><section id="home"><div class="hero"><h2 id="ht">📚 My Nouns</h2><p id="hs">تعلم الأسماء الإنجليزية</p></div><div class="stats"><div class="stat"><b id="s1">0</b><span id="l1">الكل</span></div><div class="stat"><b id="s2">0</b><span id="l2">تعلمت</span></div><div class="stat"><b id="s3">0</b><span id="l3">محفوظة</span></div></div><div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span id="pl">التقدم</span><span id="pc">0%</span></div><div class="progress"><div id="pf" style="width:0%"></div></div><div style="font-size:12px;color:var(--tx2);margin-top:6px;text-align:center" id="pt">0 / 0</div></div><div class="grid2"><button class="btn btn-p big" onclick="learn()"><span class="ico">📖</span><span class="ttl" id="b1">ابدأ التعلم</span></button><button class="btn btn-p big" onclick="go('search')"><span class="ico">🔍</span><span class="ttl" id="b2">بحث</span></button></div></section><section id="learn" class="hide"><div id="lempty" class="hide" style="text-align:center;padding:40px"><div style="font-size:50px">🎉</div><p id="le">أكملت جميع الكلمات!</p></div><div id="lbody"><div class="card" style="padding:0;overflow:hidden"><div class="emoji" id="le2">📖</div><div style="padding:20px"><div class="wen" id="lw">book</div><div class="war" id="la">كتاب</div><div class="chipline"><span class="chip" id="lc">School</span><span class="chip" id="ll">L1</span></div><button class="btn btn-p" onclick="sL()" style="margin-bottom:10px">🔊 <span id="ls">استمع</span></button><div class="ex" id="lx"></div></div></div><div class="grid3"><button class="btn btn-s" onclick="mark('learned')">✓ <span id="mk1">أعرفها</span></button><button class="btn btn-w" onclick="mark('review')">↻ <span id="mk2">راجعها</span></button><button class="btn btn-o" onclick="nw()">→ <span id="mk3">التالي</span></button></div><div class="row"><button class="btn btn-g" id="sb" onclick="tS()">⭐ <span id="mv">حفظ</span></button><button class="btn btn-g" onclick="sL()">🔊 <span id="mp">نطق</span></button></div></div></section><section id="saved" class="hide"><h2 style="margin-bottom:12px">⭐ <span id="ts">الكلمات المحفوظة</span></h2><div id="sl"></div></section><section id="progress" class="hide"><h2 style="margin-bottom:12px">📊 <span id="tp">التقدم</span></h2><div id="pr"></div></section><section id="search" class="hide"><h2 style="margin-bottom:12px">🔍 <span id="tse">بحث</span></h2><input class="search" id="sq" placeholder="ابحث..." oninput="dS()"><div id="sr"></div></section></div><nav class="nav"><button class="on" data-s="home" onclick="go('home')"><span class="ic">🏠</span><span id="nh">الرئيسية</span></button><button data-s="learn" onclick="learn()"><span class="ic">📖</span><span id="nl">تعلم</span></button><button data-s="saved" onclick="go('saved')"><span class="ic">⭐</span><span id="nv">محفوظة</span></button><button data-s="progress" onclick="go('progress')"><span class="ic">📊</span><span id="np">تقدمي</span></button></nav><div class="toast" id="toast"></div><script>
var W=[["man","رجل","People","👨"],["woman","امرأة","People","👩"],["boy","ولد","People","👦"],["girl","بنت","People","👧"],["baby","طفل","People","👶"],["father","أب","People","👨"],["mother","أم","People","👩"],["brother","أخ","People","🧑"],["sister","أخت","People","👧"],["friend","صديق","People","👫"],["head","رأس","Body","🧠"],["eye","عين","Body","👁️"],["hand","يد","Body","✋"],["heart","قلب","Body","❤️"],["house","منزل","Home","🏠"],["door","باب","Home","🚪"],["window","نافذة","Home","🪟"],["key","مفتاح","Home","🔑"],["table","طاولة","Furniture","🪑"],["chair","كرسي","Furniture","💺"],["bed","سرير","Furniture","🛏️"],["lamp","مصباح","Furniture","💡"],["shirt","قميص","Clothes","👕"],["shoes","أحذية","Clothes","👟"],["hat","قبعة","Clothes","🎩"],["apple","تفاحة","Food","🍎"],["banana","موزة","Food","🍌"],["bread","خبز","Food","🍞"],["water","ماء","Drinks","💧"],["coffee","قهوة","Drinks","☕"],["dog","كلب","Animals","🐕"],["cat","قطة","Animals","🐈"],["lion","أسد","Animals","🦁"],["sun","شمس","Nature","☀️"],["moon","قمر","Nature","🌙"],["tree","شجرة","Nature","🌳"],["flower","زهرة","Nature","🌸"],["city","مدينة","Places","🏙️"],["park","حديقة","Places","🏞️"],["car","سيارة","Transportation","🚗"],["bus","حافلة","Transportation","🚌"],["book","كتاب","School","📕"],["pen","قلم","School","🖊️"],["phone","هاتف","Technology","📱"],["computer","كمبيوتر","Technology","💻"],["money","نقود","Money","💰"],["time","وقت","Time","⏰"],["day","يوم","Time","☀️"],["music","موسيقى","Entertainment","🎵"],["movie","فيلم","Entertainment","🎬"]];
var S={learned:new Set(JSON.parse(localStorage.getItem('l')||'[]')),saved:new Set(JSON.parse(localStorage.getItem('v')||'[]')),theme:localStorage.getItem('t')||'light',lang:localStorage.getItem('g')||'ar',rate:0.9,pitch:1};
var N=W.map(function(w,i){return{id:i,word:w[0],arabic:w[1],category:w[2],emoji:w[3]}});
function T(k){var d={ar:{ht:'📚 My Nouns',hs:'تعلم الأسماء الإنجليزية',s1:'الكل',s2:'تعلمت',s3:'محفوظة',pl:'التقدم',b1:'ابدأ التعلم',b2:'بحث',ts:'الكلمات المحفوظة',tp:'التقدم',tse:'بحث',nh:'الرئيسية',nl:'تعلم',nv:'محفوظة',np:'تقدمي',ls:'استمع',mk1:'أعرفها',mk2:'راجعها',mk3:'التالي',mv:'حفظ',mp:'نطق',le:'أكملت جميع الكلمات!',ph:'ابحث بالعربية أو الإنجليزية...'},en:{ht:'📚 My Nouns',hs:'Learn English Nouns',s1:'Total',s2:'Learned',s3:'Saved',pl:'Progress',b1:'Start Learning',b2:'Search',ts:'Saved Words',tp:'Progress',tse:'Search',nh:'Home',nl:'Learn',nv:'Saved',np:'Progress',ls:'Listen',mk1:'I Know',mk2:'Review',mk3:'Next',mv:'Save',mp:'Pronounce',le:'All done!',ph:'Search...'}};return(d[S.lang]||d.ar)[k]||k}
function save(){localStorage.setItem('l',JSON.stringify([...S.learned]));localStorage.setItem('v',JSON.stringify([...S.saved]));localStorage.setItem('t',S.theme);localStorage.setItem('g',S.lang)}
function toast(m,c){var el=document.getElementById('toast');el.textContent=m;el.className='toast show '+(c||'');setTimeout(function(){el.className='toast '+(c||'')},1800)}
function go(s){document.querySelectorAll('#wrap>section').forEach(function(x){x.classList.add('hide')});var el=document.getElementById(s);if(el)el.classList.remove('hide');document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.s===s)});if(s==='home')rh();if(s==='saved')rs();if(s==='progress')rp();if(s==='search')dS()}
function rh(){document.getElementById('s1').textContent=N.length;document.getElementById('s2').textContent=S.learned.size;document.getElementById('s3').textContent=S.saved.size;var p=N.length?Math.round(S.learned.size/N.length*100):0;document.getElementById('pc').textContent=p+'%';document.getElementById('pf').style.width=p+'%';document.getElementById('pt').textContent=S.learned.size+' / '+N.length}
var q=[],qi=0;
function learn(){q=N.filter(function(n){return!S.learned.has(n.id)}).map(function(n){return n.id});if(!q.length)q=N.map(function(n){return n.id});for(var i=q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=q[i];q[i]=q[j];q[j]=t}qi=0;go('learn');sw()}
function sw(){if(qi>=q.length){document.getElementById('lempty').classList.remove('hide');document.getElementById('lbody').classList.add('hide');return}document.getElementById('lempty').classList.add('hide');document.getElementById('lbody').classList.remove('hide');var n=N[q[qi]];document.getElementById('le2').textContent=n.emoji;document.getElementById('lw').textContent=n.word;document.getElementById('la').textContent=n.arabic;document.getElementById('lc').textContent=n.category;document.getElementById('ll').textContent='L1';document.getElementById('lx').textContent='Example: This is a '+n.word+'.';document.getElementById('sb').style.background=S.saved.has(n.id)?'#F59E0B':'';document.getElementById('sb').style.color=S.saved.has(n.id)?'#fff':''}
function nw(){qi++;sw()}
function sL(){var n=N[q[qi]];if(n)say(n.word)}
function say(t,r){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||0.9;u.pitch=S.pitch;var vs=speechSynthesis.getVoices();var v=vs.find(function(x){return x.lang==='en-US'&&x.name.indexOf('Google')>-1})||vs.find(function(x){return x.lang==='en-US'});if(v)u.voice=v;speechSynthesis.speak(u)}
function mark(t){var n=N[q[qi]];if(!n)return;if(t==='learned'){if(!S.learned.has(n.id))S.learned.add(n.id);toast('أحسنت! ✓','ok')}else{toast('سنراجعها لاحقاً')}save();rh();nw()}
function tS(){var n=N[q[qi]];if(!n)return;if(S.saved.has(n.id)){S.saved.delete(n.id);toast('تم إلغاء الحفظ')}else{S.saved.add(n.id);toast('تم الحفظ ⭐','ok')}save();sw()}
function rs(){var el=document.getElementById('sl');var ids=[...S.saved];if(!ids.length){el.innerHTML='<div style="text-align:center;padding:30px;color:var(--tx2)">لا توجد كلمات محفوظة</div>';return}el.innerHTML=ids.map(function(i){return ri(N[i])}).join('')}
function ri(n){if(!n)return'';var m=(S.learned.has(n.id)?'✅':'')+(S.saved.has(n.id)?'⭐':'');return'<div class="item" onclick="say(\''+n.word+'\')"><div class="em">'+n.emoji+'</div><div class="inf"><div class="e">'+n.word+'</div><div class="a">'+n.arabic+'</div></div><div>'+m+'</div></div>'}
function rp(){var t=N.length,l=S.learned.size,r=t-l,p=t?Math.round(l/t*100):0;var h='<div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>'+T('pl')+'</span><span>'+p+'%</span></div><div class="progress"><div style="width:'+p+'%"></div></div></div>';h+='<div class="card"><b style="font-size:24px;color:#4F46E5">'+t+'</b><div style="font-size:12px;color:var(--tx2)">Total</div></div>';h+='<div class="card"><b style="font-size:24px;color:#10B981">'+l+'</b><div style="font-size:12px;color:var(--tx2)">Learned</div></div>';h+='<div class="card"><b style="font-size:24px;color:#F59E0B">'+r+'</b><div style="font-size:12px;color:var(--tx2)">Remaining</div></div>';h+='<div class="card"><b style="font-size:24px;color:#7C3AED">'+S.saved.size+'</b><div style="font-size:12px;color:var(--tx2)">Saved</div></div>';document.getElementById('pr').innerHTML=h}
function dS(){var v=(document.getElementById('sq').value||'').toLowerCase();var r=N.filter(function(n){return n.word.toLowerCase().indexOf(v)>-1||n.arabic.indexOf(v)>-1});var el=document.getElementById('sr');if(!r.length){el.innerHTML='<div style="text-align:center;padding:30px;color:var(--tx2)">لا توجد نتائج</div>';return}el.innerHTML=r.slice(0,100).map(function(n){return ri(n)}).join('')}
function apply(){document.documentElement.setAttribute('class',S.theme==='dark'?'dark':'');document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.getElementById('th').textContent=S.theme==='dark'?'☀️':'🌙';document.getElementById('lg').textContent=S.lang==='ar'?'EN':'ع';['ht','hs','s1','s2','s3','pl','b1','b2','ts','tp','tse','nh','nl','nv','np','ls','mk1','mk2','mk3','mv','mp','le'].forEach(function(k){var el=document.getElementById(k);if(el)el.textContent=T(k)});document.getElementById('sq').placeholder=T('ph')}
document.getElementById('th').onclick=function(){S.theme=S.theme==='dark'?'light':'dark';apply();save()};
document.getElementById('lg').onclick=function(){S.lang=S.lang==='ar'?'en':'ar';apply();save();rh()};
apply();rh();
</script></body></html>
